<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5a2347">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Lora:ital,wght@0,500;1,500&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
<meta name="description" content="Thiệp chúc mừng 20/10 dành riêng cho bạn: nhập tên, nhận lời chúc và mở quà bất ngờ.">
<title>20/10 – Một món quà nhỏ, ngàn yêu thương</title>
<style>
@property --c1{syntax:'<color>';inherits:true;initial-value:#e8789f}
@property --c2{syntax:'<color>';inherits:true;initial-value:#f2b78e}
@property --c3{syntax:'<color>';inherits:true;initial-value:#5a2347}
@property --acc{syntax:'<color>';inherits:true;initial-value:#ffd9b8}
:root{transition:--c1 3s,--c2 3s,--c3 3s,--acc 3s}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{min-height:100svh;background:var(--c3);color:#fff;font:16px/1.5 'Be Vietnam Pro',system-ui,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-30%;z-index:-3;background:conic-gradient(from 0deg,var(--c1),var(--c3),var(--c2),var(--c3),var(--c1));animation:spin 60s linear infinite;opacity:.78}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.45));pointer-events:none}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
body.fxtop #fx{z-index:5}
.paper .sh{display:none}
h1.shim{animation:none}.scr .big{animation:none}
#orbs .orb{filter:none;--oc:var(--c2);background:radial-gradient(circle,var(--oc),transparent 68%)!important}#orbs .orb:nth-child(2){--oc:var(--c1)}#orbs .orb:nth-child(3){--oc:var(--acc)}
#steps,#theme,#snd,#mus,#mm,.ghost{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
#steps,#theme,#snd,#mus,#mm{background:rgba(12,6,26,.62)!important}.btn.ghost{background:rgba(12,6,26,.6)}
body::before{will-change:transform}
body::before{transition:opacity .65s}body.sw::before{opacity:0!important}
body[data-bg="1"]::before{inset:0;background:linear-gradient(135deg,var(--c3),var(--c1),var(--c2),var(--c3));background-size:300% 300%;animation:pan 14s ease-in-out infinite alternate}
body[data-bg="2"]::before{inset:0;background:radial-gradient(circle at 25% 25%,var(--c1),transparent 55%),radial-gradient(circle at 78% 72%,var(--c2),transparent 55%),var(--c3);animation:none}
@keyframes pan{to{background-position:100% 100%}}
#orbs{position:fixed;inset:0;z-index:-2;pointer-events:none;transition:transform .5s ease-out}
#orbs::after{content:"";position:absolute;inset:-5%;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.5px);background-size:36px 36px}
.orb{position:absolute;border-radius:50%;filter:blur(50px);background:var(--c2);opacity:.45;animation:drift 20s ease-in-out infinite alternate}
.orb:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-10vmax}
.orb:nth-child(2){width:36vmax;height:36vmax;right:-8vmax;bottom:-8vmax;background:var(--c1);animation-delay:-7s}
.orb:nth-child(3){width:24vmax;height:24vmax;left:40%;top:35%;background:var(--acc);opacity:.22;animation-delay:-13s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes twinkle{50%{transform:scale(1.15) rotate(8deg)}}
@keyframes spin3d{to{transform:rotateY(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}55%{transform:translateY(0) scale(1.06,.94)}}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
@keyframes glow{50%{transform:scale(1.08)}}
@keyframes in{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.5) rotate(-10deg)}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}}
@keyframes shake{0%,100%{transform:rotate(0)}8%{transform:rotate(-4deg)}16%{transform:rotate(4deg)}24%{transform:rotate(0)}}
.scr{min-height:100svh;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 16px 40px;text-align:center;position:relative;z-index:2}
.scr.on{display:flex;animation:in .8s ease both}
h1,h2,h3,h4{font-family:'Playfair Display','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;margin:0;line-height:1.28}
h1{font-size:clamp(2rem,6.2vw,3.9rem);max-width:15em;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.lead{font-size:clamp(1.05rem,2.6vw,1.35rem);max-width:30em;margin:0;text-shadow:0 2px 12px rgba(0,0,0,.4);font-style:italic}
.sub{opacity:.85;font-size:.95rem;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.hero{position:relative;width:210px;height:210px;display:grid;place-items:center}
.hero .m{font-size:92px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
.hero::before{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(var(--acc),transparent 68%);opacity:.5;animation:pulse 3.5s ease-in-out infinite}
.orbit{position:absolute;inset:0;animation:spin 16s linear infinite}
.orbit i{position:absolute;font-style:normal;font-size:26px}
.orbit i:nth-child(1){top:0;left:50%}.orbit i:nth-child(2){bottom:14%;left:6%}.orbit i:nth-child(3){bottom:14%;right:6%}
.btn{border:0;border-radius:999px;padding:14px 30px;font:600 1.05rem 'Be Vietnam Pro',system-ui,'Segoe UI',sans-serif;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--c3),var(--c1));background:linear-gradient(135deg,var(--c3),color-mix(in srgb,var(--c1) 62%,var(--c3)));box-shadow:0 8px 26px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.4);transition:transform .25s,box-shadow .25s,filter .25s;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.btn:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 0 0 1px #fff}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn:focus-visible,.link:focus-visible,input:focus-visible,#snd:focus-visible,#theme:focus-visible,#mus:focus-visible,#mm:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ghost{background:rgba(12,6,26,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:11px 20px;font-size:.95rem}
.link{background:none;border:0;color:#6b4a5c;font:inherit;cursor:pointer;text-decoration:underline;margin-top:8px}
.panel{background:rgba(255,250,246,.93);color:#3b2233;border-radius:26px;padding:30px 26px;width:min(92vw,440px);box-shadow:0 24px 70px rgba(0,0,0,.45);border:2px solid var(--acc);text-align:left}
.panel h2{font-size:1.7rem;color:var(--c3);text-align:center}
.panel p{text-align:center;margin:8px 0 18px;color:#6b4a5c}
label{display:block;font-weight:600;margin-top:12px}
input{width:100%;margin-top:6px;padding:13px 15px;border-radius:14px;border:2px solid #e6d2d9;background:#fff;font:inherit;color:#3b2233;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--c1);box-shadow:0 0 0 4px rgba(255,160,190,.3)}
input[aria-invalid=true]{border-color:#c0224f}
.err{color:#b3123f;font-size:.88rem;min-height:1.2em;margin-top:4px}
.panel .btn{width:100%;margin-top:14px}.panel .link{display:block;margin:10px auto 0}
.env{position:relative;width:min(78vw,300px);height:200px;margin-top:100px;background:linear-gradient(160deg,var(--c2),var(--c1));border-radius:8px;box-shadow:0 22px 50px rgba(0,0,0,.45);animation:float 4s ease-in-out infinite}
.letter{position:absolute;left:14px;right:14px;top:12px;bottom:12px;background:#fffaf5;border-radius:6px;display:grid;place-items:center;font-size:46px;z-index:1;transition:transform .9s .55s}
.env.open .letter{transform:translateY(-100px)}
.pocket{position:absolute;inset:0;z-index:2;border-radius:8px;background:linear-gradient(160deg,var(--c1),var(--c3));clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;z-index:3;background:linear-gradient(var(--c2),var(--c1));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s,z-index 0s .35s}
.env.open .flap{transform:perspective(900px) rotateX(180deg);z-index:0}
#stage{display:flex;flex-direction:column;align-items:center;gap:26px}
.paper{position:relative;width:min(92vw,520px);padding:38px 26px 30px;border-radius:20px;color:#3b2233;background:linear-gradient(160deg,#fffaf5,#fff0f4);border:3px double var(--c1);box-shadow:0 0 0 8px rgba(255,255,255,.18),0 28px 70px rgba(0,0,0,.5)}
.paper{transition:transform .2s ease-out}
.paper.pop{animation:pop .9s cubic-bezier(.2,1.3,.4,1) both}
.paper::before,.paper::after{content:"🌸";position:absolute;font-size:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.paper::before{top:-16px;left:-10px;animation:sway 5s ease-in-out infinite}.paper::after{bottom:-16px;right:-10px;animation:sway 6s ease-in-out infinite reverse}
.tag{color:var(--c3);font-size:.95rem;letter-spacing:.06em;font-weight:600}
#nameEl{font-size:clamp(2.1rem,9vw,3.4rem);color:var(--c3);margin:8px 0 4px;overflow-wrap:anywhere}
#nameEl.s{font-size:clamp(1.5rem,6vw,2.2rem)}
#nameEl.xs{font-size:clamp(1.15rem,4.8vw,1.6rem)}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;animation:pop .7s both}
.bar{height:3px;width:120px;margin:10px auto 16px;border-radius:3px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c1))}
#wish{font-size:1.15rem;line-height:1.75;font-style:italic;font-family:'Lora',Georgia,'Times New Roman',serif;margin:0 0 14px}
.fact{margin:14px 0 0;font-size:.85rem;color:#6b4a5c;border-top:1px dashed var(--c1);padding-top:10px;animation:fade 1s .8s both}
.fade{animation:fade .7s both}
.giftwrap{display:grid;place-items:center;min-height:230px}
.giftwrap>*{grid-area:1/1}
.box{position:relative;width:130px;height:130px;margin-top:10px;transition:opacity .5s .2s,transform .5s .2s;animation:shake 2.8s ease-in-out infinite}
.box.gone{opacity:0;transform:scale(.4);pointer-events:none}
.box .bd{position:absolute;bottom:0;left:0;right:0;height:84px;border-radius:6px;background:linear-gradient(var(--c1),var(--c3))}
.box .bd::after,.box .lid::after{content:"";position:absolute;left:50%;width:24px;margin-left:-12px;top:0;bottom:0;background:var(--acc)}
.box .lid{position:absolute;top:8px;left:-7px;right:-7px;height:44px;border-radius:7px;background:linear-gradient(var(--c1),var(--c3));filter:brightness(1.15);transition:transform .7s cubic-bezier(.3,1.4,.5,1),opacity .6s .2s;box-shadow:0 5px 10px rgba(0,0,0,.25)}
.box .lid::before{content:"🎀";position:absolute;top:-30px;left:50%;margin-left:-20px;font-size:38px;z-index:2}
.box.open{animation:none}
.box.open .lid{transform:translateY(-80px) rotate(-24deg);opacity:0}
.box.open .bd::after{animation:pulse .6s}
.gift.rise{animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}
.gemo{position:relative;font-size:110px;line-height:1.1;display:inline-block;filter:drop-shadow(0 0 14px var(--acc))}
.gemo.float{animation:float 3.5s ease-in-out infinite}.gemo.sway{animation:sway 3.5s ease-in-out infinite;transform-origin:bottom}
.gemo.twinkle{animation:twinkle 2.4s ease-in-out infinite}.gemo.spin{animation:spin3d 6s linear infinite}
.gemo.bounce{animation:bounce 2.2s ease-in-out infinite}.gemo.pulse{animation:pulse 2.4s ease-in-out infinite}
.gemo.wiggle{animation:wiggle 2.8s ease-in-out infinite}.gemo.glow{animation:glow 2.8s ease-in-out infinite}
.gift h4{font-size:1.4rem;color:var(--c3)}.gift p{margin:4px 0 0;color:#6b4a5c}
#closing{margin:14px 0 0;font-weight:600;color:var(--c3);animation:fade 1s .4s both}
#acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:620px;animation:fade 1s .5s both}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);opacity:0;z-index:9;background:rgba(255,250,246,.96);color:#3b2233;padding:11px 22px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:.35s;pointer-events:none;font-weight:600}
#toast.on{transform:translate(-50%,0);opacity:1}
#theme,#snd,#mus,#mm{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:8;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(12,6,26,.4);backdrop-filter:blur(8px);font-size:20px;cursor:pointer;transition:transform .3s}
#snd{right:66px}#mus{right:118px}#mm{right:170px}#mus[aria-pressed=false]{opacity:.55}
#snd:hover,#theme:hover,#mus:hover,#mm:hover{transform:rotate(40deg) scale(1.1)}
@keyframes shimmer{to{background-position:200% 0}}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.06)}}
@keyframes shine{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes zoom{from{opacity:0;transform:scale(3) rotate(180deg)}}
@keyframes drop{0%{opacity:0;transform:translateY(-320px)}60%{opacity:1;transform:translateY(12px)}80%{transform:translateY(-14px)}}
.scr{padding-top:calc(72px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.shim{text-shadow:none;background:linear-gradient(90deg,#fff,var(--acc),#fff,var(--acc),#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5)) drop-shadow(0 6px 20px rgba(0,0,0,.55))}
.big{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:900 clamp(7rem,30vw,20rem)/1 Georgia,serif;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.2);z-index:-1;pointer-events:none;user-select:none;animation:breathe 7s ease-in-out infinite}
.hero::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,255,255,.45);animation:spin 22s linear infinite}
#steps{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:8;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;border-radius:999px;background:rgba(12,6,26,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:.85rem;font-weight:600;border:1px solid rgba(255,255,255,.35)}
#steps span{display:flex;gap:6px}#steps i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:.4s}
#steps i.on{background:var(--acc);box-shadow:0 0 8px var(--acc);transform:scale(1.3)}
@media(max-width:480px){#steps b{display:none}}
.paper .sh{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);background-size:250% 100%;animation:shine 5s 1.5s infinite;mix-blend-mode:overlay}
.paper.t1{background:linear-gradient(160deg,#2a1240,#4d1f63);color:#fff4fa;border-color:var(--acc)}
.paper.t1 :is(.tag,#nameEl,.gift h4,#closing){color:var(--acc)}.paper.t1 :is(.gift p,.fact){color:#e9d6ee}
.paper.t2{background:linear-gradient(135deg,#fff6d8,#f6d98c 45%,#fff2c2 62%,#e8c25f);border-color:#b8862b}
.paper.t3{background:radial-gradient(circle at 18% 12%,#ffd9e8,transparent 55%),radial-gradient(circle at 85% 88%,#d6efff,transparent 55%),#fffaf6}
.gift{position:relative}.gift>:not(.aura){position:relative;z-index:1}
.gift.r0{animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}.gift.r1{animation:zoom 1.1s cubic-bezier(.2,1.2,.3,1) both}.gift.r2{animation:drop 1.1s both}
.aura{position:absolute;left:50%;top:-34px;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:repeating-conic-gradient(var(--c2) 0 8deg,transparent 8deg 20deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 68%);mask:radial-gradient(circle,#000 10%,transparent 68%);animation:spin 14s linear infinite;opacity:.6;pointer-events:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="orbs" aria-hidden="true"><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div id="steps" aria-hidden="true"><b>💐 Thiệp 20/10</b><span><i></i><i></i><i></i><i></i><i></i></span></div>
<button id="snd" aria-pressed="true" aria-label="Bật tắt âm thanh" title="Âm thanh (đang bật)">🔔</button>
<button id="mus" aria-label="Đổi bài nhạc ngẫu nhiên" title="Đổi bài nhạc ngẫu nhiên">🎵</button>
<button id="mm" aria-label="Tạm dừng hoặc phát nhạc" title="Tạm dừng nhạc">⏸</button>
<button id="theme" aria-label="Đổi giao diện màu" title="Đổi giao diện màu">🎨</button>

<section id="home" class="scr on">
  <div class="big" aria-hidden="true">20/10</div>
  <div class="hero" aria-hidden="true"><div class="m">💌</div><div class="orbit"><i>🌸</i><i>✨</i><i>💖</i></div></div>
  <h1 class="shim">Chúc mừng Ngày Phụ nữ Việt Nam 20/10</h1>
  <p class="lead">Dành tặng bạn một chút dịu dàng giữa cuộc sống bộn bề</p>
  <button class="btn" id="start">Nhận thiệp yêu thương</button>
  <span class="sub">Một lời chúc dành riêng cho bạn</span>
</section>

<section id="form" class="scr">
  <div class="panel" id="f">
    <h2>Thiệp này gửi cho ai?</h2>
    <p>Chỉ cần hai điều nhỏ xíu. Thông tin ở lại trên máy của bạn.</p>
    <label for="nm">🌸 Họ và tên người nhận</label>
    <input id="nm" maxlength="40" autocomplete="off" placeholder="Ví dụ: Nguyễn Thu Hà">
    <div class="err" id="e1" role="alert"></div>
    <label for="ag">🎂 Độ tuổi</label>
    <input id="ag" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="Ví dụ: 28">
    <div class="err" id="e2" role="alert"></div>
    <button class="btn" type="button" id="go">Tạo thiệp của tôi</button>
    <button class="link" type="button" id="back">← Quay lại trang chủ</button>
  </div>
</section>

<section id="card" class="scr">
  <div id="stage">
    <div class="env" id="env"><div class="letter">💌</div><div class="pocket"></div><div class="flap"></div></div>
    <button class="btn" id="openCard">Mở thiệp</button>
  </div>
  <article class="paper" id="paper" hidden>
    <div class="sh"></div>
    <div class="tag">20/10 · Chúc mừng Ngày Phụ nữ Việt Nam</div>
    <h2 id="nameEl"></h2><div class="bar"></div>
    <p id="wish"></p>
    <div class="giftwrap">
      <div class="box" id="box"><div class="bd"></div><div class="lid"></div></div>
      <div class="gift" id="gift" hidden><div class="aura"></div><div class="gemo" id="gemo"></div><h4 id="gname"></h4><p id="gdesc"></p></div>
    </div>
    <button class="btn" id="openGift">Mở quà</button>
    <p id="closing" hidden></p>
    <p class="fact" id="fact" hidden></p>
  </article>
  <div id="acts" hidden>
    <button class="btn ghost" id="bWish">💬 Nhận lời chúc khác</button>
    <button class="btn ghost" id="bLuck">🍀 Thử vận may</button>
    <button class="btn ghost" id="bCopy">📋 Sao chép lời chúc</button>
    <button class="btn ghost" id="bShare">💌 Chia sẻ thiệp</button>
    <button class="btn ghost" id="bNew">✨ Tạo thiệp mới</button>
    <button class="btn ghost" id="bHome">🏠 Làm lại từ đầu</button>
  </div>
</section>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n);
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
